[project]
name = "empathetic-voice-assistant"
version = "0.1.0"
description = "Offline empathetic voice assistant with ASR + LLM + TTS + Telegram bot"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Practice_HSE"}]
dependencies = [
  "aiogram>=3.4.1",
  "faster-whisper>=1.0.3",
  "httpx>=0.27.0",
  "pydantic>=2.7.1",
  "pydantic-settings>=2.2.1",
  "soundfile>=0.12.1",
  "torch>=2.2.0",

  # LLM 
  "gigachat>=0.1.36",
  "ollama>=0.2.1",

  # БД 
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "redis[hiredis]>=5.0.6",

  # Анализ эмоций 
  "transformers>=4.41.0",
  "dostoevsky>=0.6.0",
  "sentencepiece>=0.2.0",

  # TTS
  "silero>=0.4.1",

  # Утилиты
  "python-dotenv>=1.0.1",
  "aiofiles>=23.2.1",
  "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0", 
  "pytest-cov>=5.0.0",       
  "ruff>=0.4.0",          
  "mypy>=1.10.0",           
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
